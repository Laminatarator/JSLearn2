  function summ(g)
  {
    let res = 0
    for (const i of g)
    {
      res += i
    }
    return res
  }
  // alert(summ([1, 8, 9, -8, 4, -20, 46]))
  // alert(summ([]))
  // alert(summ([0.5, 0.6, -0.04, 0.0833]))
  function avg(ns)
  {
    const res = summ(ns)/ns.length
    return res
  }

</script>
